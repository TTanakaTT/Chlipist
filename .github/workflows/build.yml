name: Build ad-hoc signed macOS app

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      DERIVED_DATA_PATH: ./.build
      APP_PATH: ./.build/Build/Products/Release/chlips.app
      ZIP_PATH: ./chlips-macos-app.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Build Release app
        run: |
          xcodebuild -project chlips.xcodeproj \
                     -scheme chlips \
                     -configuration Release \
                     -derivedDataPath "$DERIVED_DATA_PATH" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Re-sign app bundle with ad-hoc identity
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Archive app bundle
        run: |
          rm -f "$ZIP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Summarize artifact status
        run: |
          {
            echo '## Artifact status'
            echo
            echo '- Built with Xcode 26.3'
            echo '- Re-signed with an ad-hoc signature so the app bundle is internally valid'
            echo '- Not notarized; first launch on another Mac requires the usual trust or quarantine-bypass step for personal use'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: chlips-macos-ad-hoc-app
          path: ./chlips-macos-app.zip
          if-no-files-found: error
