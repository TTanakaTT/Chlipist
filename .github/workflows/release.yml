name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      DERIVED_DATA_PATH: ./.build
      APP_PATH: ./.build/Build/Products/Release/Chlipist.app
      DMG_STAGING_PATH: ./.build/dmg
      DMG_PATH: ./Chlipist.dmg
      DMG_VOLUME_NAME: Chlipist
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported tag format: $TAG_NAME" >&2
            exit 1
          fi

      - name: Extract release metadata
        id: metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          if git rev-parse -q --verify "refs/tags/$TAG_NAME^{tag}" >/dev/null; then
            git for-each-ref --format='%(contents)' "refs/tags/$TAG_NAME" > "$notes_file"
          else
            {
              echo "Release $TAG_NAME"
              echo
              echo "Commit: $(git rev-list -n 1 "$TAG_NAME")"
            } > "$notes_file"
          fi

          if [[ ! -s "$notes_file" ]]; then
            echo "Release $TAG_NAME" > "$notes_file"
          fi

          {
            echo "MARKETING_VERSION=$version"
            echo "CURRENT_PROJECT_VERSION=$RUN_NUMBER"
            echo "RELEASE_NOTES_PATH=$notes_file"
          } >> "$GITHUB_ENV"

          echo "release_notes_path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Build Release app
        run: |
          make build \
            DERIVED_DATA_PATH="$DERIVED_DATA_PATH" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"

      - name: Re-sign app bundle with ad-hoc identity
        run: |
          sh ./scripts/resign-app.sh "$APP_PATH"

      - name: Archive DMG
        run: |
          sh ./scripts/create-dmg.sh \
            "$APP_PATH" \
            "$DMG_STAGING_PATH" \
            "$DMG_PATH" \
            "$DMG_VOLUME_NAME"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.metadata.outputs.release_notes_path }}
          files: ./Chlipist.dmg
